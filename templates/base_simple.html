<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>netSA - Social Network</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        nav {
            background-color: #333;
            padding: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            color: white;
            text-decoration: none;
            font-size: 1.5rem;
            font-weight: bold;
        }

        .nav-links {
            display: flex;
            gap: 1rem;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            padding: 0.5rem 1rem;
            margin-top: 0;
        }

        .nav-links a:hover {
            background-color: #555;
            border-radius: 4px;
        }

        .content {
            padding: 1rem;
        }

        a {
            display: inline-block;
            padding: 0.5rem 1rem;
            background-color: #4CAF50;
            color: white;
            text-decoration: none;
            border-radius: 4px;
            border: none;
            cursor: pointer;
            transition: background-color 0.3s ease;
            margin-top: 1rem;
        }

        a:hover {
            background-color: #45a049;
        }

        .logo {
            background-color: transparent;
            padding: 0;
        }

        .logo:hover {
            background-color: transparent;
        }


    </style>
</head>
<body>
<nav>
    <a href="/" class="logo">netSA</a>
    <div class="nav-links">
        <!-- Links -->
    </div>
</nav>
<div class="content">
    {% block content %}
    {% endblock %}
</div>
</body>
</html>
