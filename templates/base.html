<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>netSA - Social Network</title>
    {% block head %}
    {% endblock %}
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        nav {
            background-color: #333;
            padding: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            color: white;
            text-decoration: none;
            font-size: 1.5rem;
            font-weight: bold;
        }

        .nav-links {
            display: flex;
            gap: 1rem;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            padding: 0.5rem 1rem;
        }

        .nav-links a:hover {
            background-color: #555;
            border-radius: 4px;
        }

        .content {
            padding: 1rem;
        }
    </style>
</head>
<body>
<nav>
    <a href="/" class="logo">netSA</a>
    <div class="nav-links">
        <a href="/">Home</a>
        <a href="/search">Search</a>
        <a href="/user/me">My profile</a>
        <a href="/user/logout">LogOut</a>
    </div>
</nav>
<div class="content">
    {% block content %}
    {% endblock %}
</div>
</body>
</html>
